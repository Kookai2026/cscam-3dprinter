<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=sites/3dprinter/index.html" />
  <title>씨에스캠(CSCAM) 통합 홈페이지</title>
  <script>
    // 3D 프린터 사업부 페이지로 자동 리다이렉트
    window.location.href = "sites/3dprinter/index.html";
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b1528;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border-left-color: #09f;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    a {
      color: #09f;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="loader-container">
    <div class="spinner"></div>
    <p>씨에스캠 홈페이지로 이동 중입니다...</p>
    <p style="font-size: 0.9rem; color: #8892b0;">자동으로 이동하지 않는다면 <a href="sites/3dprinter/index.html">여기</a>를 클릭하세요.</p>
  </div>
</body>
</html>
