<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSCAM 3D프린터 — 모바일 미리보기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif;
      background: #eef1f6; color: #1f2937;
      min-height: 100vh; padding: 24px 16px 48px;
      display: flex; flex-direction: column; align-items: center;
    }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    p.sub { font-size: 13px; color: #6b7280; margin-bottom: 20px; }
    .controls { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; justify-content: center; }
    .controls button {
      font: inherit; font-size: 13px; font-weight: 600;
      padding: 8px 16px; border-radius: 20px; cursor: pointer;
      border: 1px solid #cbd5e1; background: #fff; color: #334155;
      transition: all .15s;
    }
    .controls button.active { background: #1e5aa8; color: #fff; border-color: #1e5aa8; }
    /* 폰 목업 프레임 */
    .phone {
      position: relative;
      border: 12px solid #111827; border-radius: 44px;
      background: #111827;
      box-shadow: 0 24px 60px rgba(0,0,0,.28);
      transition: width .25s ease;
    }
    .phone::before { /* 상단 노치 */
      content: ''; position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 42%; height: 22px; background: #111827; border-radius: 0 0 16px 16px; z-index: 2;
    }
    .phone iframe {
      display: block; width: 100%; height: 812px;
      border: none; border-radius: 32px; background: #fff;
    }
    .size-label { margin-top: 14px; font-size: 12px; color: #6b7280; }
    .hint { margin-top: 26px; font-size: 12px; color: #94a3b8; max-width: 420px; text-align: center; line-height: 1.6; }
    .hint a { color: #1e5aa8; }
  </style>
</head>
<body>
  <h1>📱 CSCAM 3D프린터 — 모바일 미리보기</h1>
  <p class="sub">PC에서 폰 화면 그대로 검토하는 페이지입니다. 실제 모바일 레이아웃과 동일하게 렌더링됩니다.</p>

  <div class="controls">
    <button data-w="360" onclick="setW(this)">360px (소형)</button>
    <button data-w="390" class="active" onclick="setW(this)">390px (표준)</button>
    <button data-w="414" onclick="setW(this)">414px (대형)</button>
  </div>

  <div class="phone" id="phone" style="width:414px;">
    <iframe id="frame" src="sites/3dprinter/index.html" title="모바일 미리보기"></iframe>
  </div>
  <div class="size-label" id="sizeLabel">화면 너비: 390px</div>

  <p class="hint">
    이 페이지는 실제 사이트(<a href="sites/3dprinter/index.html" target="_blank">sites/3dprinter/index.html</a>)를
    폰 크기 창에 넣어 보여줍니다. 위 버튼으로 기기 폭을 바꿔 검토하세요.<br>
    실제 폰에서 볼 때와 동일합니다.
  </p>

  <script>
    function setW(btn){
      const w = parseInt(btn.dataset.w, 10);
      // 테두리(12px*2)를 더해 내부 콘텐츠가 정확히 w가 되게
      document.getElementById('phone').style.width = (w + 24) + 'px';
      document.getElementById('sizeLabel').textContent = '화면 너비: ' + w + 'px';
      document.querySelectorAll('.controls button').forEach(b => b.classList.toggle('active', b === btn));
    }
    // 초기값 390
    setW(document.querySelector('.controls button[data-w="390"]'));
  </script>
</body>
</html>
